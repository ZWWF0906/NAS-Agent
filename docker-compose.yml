version: "3.8"
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    cap_add:
      - NET_RAW
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "100.100.138.38:9000:9000"
    networks:
      - internal

  alist:
    image: xhofe/alist:latest
    container_name: alist
    restart: always
    volumes:
      - ./alist/data:/opt/alist/data
    ports:
      - "100.100.138.38:5244:5244"
    environment:
      - PUID=1000
      - PGID=1000
    networks:
      - internal

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: always
    volumes:
      - ./gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "100.100.138.38:3000:3000"
      - "100.100.138.38:2222:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
    networks:
      - internal

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    volumes:
      - ./vaultwarden/data:/data
    ports:
      - "100.100.138.38:8081:80"
    environment:
      - SIGNUPS_ALLOWED=false
    networks:
      - internal

  agent:
    build: ./agent
    container_name: agent
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agent/app:/app
    ports:
      - "100.100.138.38:5050:5050"
    environment:
      - API_KEY=your_api_key_here
      - NAS_IP=your_ip_here
      - NAS_USER=your_name_here
    cap_add:
      - NET_RAW
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  portainer_data:
    external: true
